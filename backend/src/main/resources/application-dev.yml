spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/learnflow_dev
    username: learnflow
    password: learnflow
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000
      pool-name: LearnFlowHikariPool-Dev

  jpa:
    show-sql: true

logging:
  level:
    com.learnflow: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.springframework.web: INFO
    org.flywaydb: INFO
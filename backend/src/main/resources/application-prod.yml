spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: LearnFlowHikariPool-Prod

  jpa:
    show-sql: false

logging:
  level:
    com.learnflow: INFO
    org.hibernate: WARN
    org.springframework: WARN

server:
  # Trust the AWS ALB's forwarded headers for real client IP addresses
  forward-headers-strategy: framework